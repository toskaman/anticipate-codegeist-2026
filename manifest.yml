modules:
  global:fullPage:
    - key: anticipate-hello-world-global-full-page-custom-ui
      resource: main
      resolver:
        function: resolver
      routePrefix: hello-world
  function:
    - key: resolver
      handler: index.handler
resources:
  - key: main
    path: static/hello-world/build
    tunnel:
      port: 3000
permissions:
  scopes:
    - read:jira-work
    - write:jira-work
    - read:jira-user
    - storage:app
app:
  runtime:
    name: nodejs24.x
    memoryMB: 256
    architecture: arm64
  id: ari:cloud:ecosystem::app/39a28f48-c891-4d86-a3cf-c14409cbd29e
  compatibility:
    jira:
      required: true
