name: CI
on:
  push:
    branches: [main, feat/core-engine, feat/product-experience]
  pull_request:
jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npx vitest run --root packages/contracts
      - run: npx vitest run --root packages/simulation-core
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: static/hello-world
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run build
