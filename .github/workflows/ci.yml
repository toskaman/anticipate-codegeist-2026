name: CI
on:
  push:
    branches: [main, feat/core-engine, feat/product-experience]
  pull_request:
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npx vitest run --root packages/contracts
      - run: npx vitest run --root packages/simulation-core
      - name: Security audit (runtime dependencies, high and above)
        run: npm audit --omit=dev --audit-level=high
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: static/hello-world
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: static/hello-world/package-lock.json
      - run: npm ci --prefix ../../packages/contracts
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run benchmark:graph
      - run: npm run licenses:inventory
      - name: Security audit (runtime dependencies, high and above)
        run: npm audit --omit=dev --audit-level=high
      - run: npm run build
  e2e:
    # Playwright Chromium (UI journeys, axe, print, UI security). PRs and pushes to main; other pushes stay fast.
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: static/hello-world
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: static/hello-world/package-lock.json
      - run: npm ci --prefix ../../packages/contracts
      - run: npm ci
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run test:browser
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: static/hello-world/playwright-report
          retention-days: 7
