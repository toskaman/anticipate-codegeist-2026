<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="960" height="420" role="img" aria-labelledby="t d" font-family="Inter, Segoe UI, Arial, sans-serif">
  <title id="t">Direct Jira links compared with ANTICIPATE's dependency path</title>
  <desc id="d">Sample dataset. Left: the Jira issue view of Legacy Auth API v1 shows two consumers and the replacement. Right: ANTICIPATE also finds Partner webhooks, two hops away through Checkout.</desc>
  <rect width="960" height="420" fill="#ffffff"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#44546f"/></marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#ae2e24"/></marker>
  </defs>
  <text x="24" y="38" font-size="20" font-weight="700" fill="#172b4d">Retiring "Legacy Auth API v1": what each view shows</text>
  <text x="24" y="62" font-size="13" fill="#44546f">ANTICIPATE sample dataset (6 issues, 4 links). Illustration of one small dataset, not a general benchmark.</text>
  <line x1="480" y1="84" x2="480" y2="396" stroke="#dcdfe4"/>
  <text x="24" y="104" font-size="15" font-weight="700" fill="#172b4d">Jira issue view of the API ticket</text>
  <text x="504" y="104" font-size="15" font-weight="700" fill="#172b4d">ANTICIPATE evidence graph</text>
  <g font-size="13">
    <rect x="24" y="200" width="160" height="44" rx="8" fill="#e9f2ff" stroke="#0c66e4"/><text x="104" y="227" text-anchor="middle" fill="#172b4d">Auth API v1 (change)</text>
    <rect x="270" y="130" width="170" height="40" rx="8" fill="#f7f8f9" stroke="#8590a2"/><text x="355" y="155" text-anchor="middle" fill="#172b4d">Checkout service</text>
    <rect x="270" y="202" width="170" height="40" rx="8" fill="#f7f8f9" stroke="#8590a2"/><text x="355" y="227" text-anchor="middle" fill="#172b4d">Mobile backend</text>
    <rect x="270" y="274" width="170" height="40" rx="8" fill="#ffffff" stroke="#8590a2" stroke-dasharray="4 3"/><text x="355" y="299" text-anchor="middle" fill="#44546f">Auth API v2 (replacement)</text>
    <path d="M184 214L268 156" stroke="#44546f" stroke-width="1.6" marker-end="url(#a)" fill="none"/>
    <path d="M184 222L268 222" stroke="#44546f" stroke-width="1.6" marker-end="url(#a)" fill="none"/>
    <path d="M184 232L268 290" stroke="#8590a2" stroke-width="1.4" stroke-dasharray="4 3" fill="none"/>
    <text x="24" y="352" fill="#44546f">Visible: 2 consumers + 1 replacement link.</text>
    <text x="24" y="372" fill="#44546f">Partner webhooks is on another ticket, two links away.</text>

    <rect x="504" y="200" width="160" height="44" rx="8" fill="#e9f2ff" stroke="#0c66e4"/><text x="584" y="227" text-anchor="middle" fill="#172b4d">Auth API v1 (change)</text>
    <rect x="700" y="130" width="120" height="40" rx="8" fill="#ffeceb" stroke="#ae2e24"/><text x="760" y="155" text-anchor="middle" fill="#172b4d">Checkout</text>
    <rect x="700" y="202" width="120" height="40" rx="8" fill="#ffeceb" stroke="#ae2e24"/><text x="760" y="227" text-anchor="middle" fill="#172b4d">Mobile backend</text>
    <rect x="836" y="130" width="112" height="40" rx="8" fill="#fff7d6" stroke="#a54800" stroke-width="2"/><text x="892" y="148" text-anchor="middle" fill="#172b4d">Partner</text><text x="892" y="163" text-anchor="middle" fill="#172b4d">webhooks</text>
    <rect x="700" y="274" width="170" height="40" rx="8" fill="#ffffff" stroke="#8590a2" stroke-dasharray="4 3"/><text x="785" y="299" text-anchor="middle" fill="#44546f">Auth API v2 (replacement)</text>
    <path d="M664 214L698 156" stroke="#ae2e24" stroke-width="1.8" marker-end="url(#r)" fill="none"/>
    <path d="M664 222L698 222" stroke="#ae2e24" stroke-width="1.8" marker-end="url(#r)" fill="none"/>
    <path d="M820 150L834 150" stroke="#a54800" stroke-width="2" marker-end="url(#r)" fill="none"/>
    <path d="M664 232L698 290" stroke="#8590a2" stroke-width="1.4" stroke-dasharray="4 3" fill="none"/>
    <text x="504" y="352" fill="#44546f">2 direct consumers (Confirmed, from Jira "blocks" links)</text>
    <text x="504" y="372" fill="#a54800" font-weight="600">+ 1 indirect consumer: Partner webhooks, 2 hops via Checkout</text>
    <text x="504" y="392" fill="#44546f">Every relation keeps its Jira link as source.</text>
  </g>
</svg>
